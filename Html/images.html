<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>

    <style>
        body{
            background-color: #414141;
        }
    </style>
</head>
<body>
    <img src="https://images.unsplash.com/photo-1790471403380-24e8149b8584?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" width="500px" alt="Butterfly Image">

    <img src="./Butterfly.avif" width="500px" alt="Butterfly Image">

    <picture>
        <source media="(min-width: 650px)" srcset="./Butterfly.avif"/>
        <source media="(min-width: 460px)" srcset="./image.png"/>
        <img src="./Butterfly.avif" alt="">
    </picture>

    <!-- An image map generator -->

    <img src="image.png" usemap="#image-map">

    <map name="image-map">
        <area onclick="one()" target="" alt="" title="" href="" coords="370,238" shape="rect">
        <area onclick="two()" target="" alt="" title="" href="" coords="929,296,NaN" shape="circle">
    </map>

    <script>
        function one(){
            alert("You clicked on one")
        }
        function two(){
            alert("You clicked on two")
        }

    </script>
</body>
</html>
